```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Central | Newsroom Portal</title>

    <link
        rel="stylesheet"
        href="support/css/styles.css"
    >

</head>


<body class="login-body">


    <div class="login-container">


        <div class="login-card">


            <!-- ==========================================
                 MARCA
            =========================================== -->

            <div class="login-brand">

                <img
                    src="img/logo1.png"
                    alt="Newsroom Portal"
                    class="login-logo"
                >

                <h1>
                    Newsroom Portal
                </h1>

                <p class="subtitle">
                    Acceso centralizado al sistema
                </p>

            </div>



            <!-- ==========================================
                 MENSAJE DE ERROR
            =========================================== -->

            <div
                id="loginError"
                class="error-message"
                style="display: none;"
            >
            </div>



            <!-- ==========================================
                 FORMULARIO DE LOGIN
            =========================================== -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Usuario"
                    autocomplete="username"
                    required
                >


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    id="loginButton"
                >
                    Ingresar
                </button>



                <!-- ==========================================
                     REGRESAR AL INICIO
                =========================================== -->

                <a
                    href="index.html"
                    class="nav-link-custom home-link"
                >

                    <i class="bi bi-house-door-fill"></i>

                    Inicio

                </a>


            </form>


        </div>


    </div>



    <!-- ==========================================
         JAVASCRIPT DEL LOGIN
    =========================================== -->

    <script src="support/js/login.js"></script>


</body>

</html>
```

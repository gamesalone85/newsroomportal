<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Newsroom Portal
    </title>


    <!-- ==================================================
         ESTILOS
    =================================================== -->

    <link
        rel="stylesheet"
        href="support/css/styles.css"
    >


    <!-- ==================================================
         ICONOS
    =================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="login-body">


<div class="login-container">


    <div class="login-card">


        <!-- ==================================================
             BRAND
        =================================================== -->

        <div class="login-brand">


            <img
                src="img/logo1.png"
                alt="Newsroom Portal"
                class="login-logo"
            >


            <h1>
                Newsroom Portal
            </h1>


            <p class="subtitle">
                Acceso centralizado al sistema
            </p>


        </div>



        <!-- ==================================================
             MENSAJE DE ERROR
        =================================================== -->

        <div
            id="loginError"
            class="error-message"
            style="display:none;"
        ></div>



        <!-- ==================================================
             LOGIN
        =================================================== -->

        <form
            id="loginForm"
            autocomplete="off"
        >


            <!-- USUARIO -->

            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Usuario"
                autocomplete="username"
                required
            >



            <!-- CONTRASEÑA -->

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Contraseña"
                autocomplete="current-password"
                required
            >



            <!-- INGRESAR -->

            <button
                type="submit"
                id="loginButton"
            >
                Ingresar
            </button>



            <!-- INICIO -->

            <a
                href="index.html"
                class="nav-link-custom home-link"
            >

                <i class="fa-solid fa-house"></i>

                Inicio

            </a>


        </form>


    </div>


</div>



<!-- =========================================================
     AUTENTICACIÓN
========================================================= -->

<script src="support/js/data.js"></script>
<script src="support/js/auth.js"></script>


</body>

</html>

```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Central | Newsroom Portal</title>

    <link rel="stylesheet" href="support/css/styles.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <div class="login-brand">

                <img
                    src="img/logo1.png"
                    alt="Newsroom Portal"
                    class="login-logo"
                >

                <h1>Newsroom Portal</h1>

                <p class="subtitle">
                    Acceso centralizado al sistema
                </p>

            </div>

            <!--
                Mensaje de error.
                JavaScript lo mostrará cuando sea necesario.
            -->
            <div
                id="error-message"
                class="error-message"
                style="display: none;"
            ></div>

            <form id="loginForm">

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Usuario"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">
                    Ingresar
                </button>

                <a
                    href="index.html"
                    class="nav-link-custom home-link"
                >
                    <i class="bi bi-house-door-fill"></i>
                    Inicio
                </a>

            </form>

        </div>

    </div>

    <!-- JavaScript del login -->
    <script src="support/js/login.js"></script>

</body>
</html>
```

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración | Newsroom Portal</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <link
        rel="stylesheet"
        href="../css/core-layout.css"
    >

</head>


<body>


<div class="layout">


    <!-- ==================================================
         SIDEBAR
         ==================================================

         Se carga desde:

         support/includes/sidebar.html

    =================================================== -->

    <div id="sidebarContainer"></div>



    <!-- ==================================================
         CONTENIDO PRINCIPAL
    =================================================== -->

    <main class="main-content">


        <!-- ==================================================
             TOPBAR
        =================================================== -->

        <header class="topbar">


            <div class="page-title">

                Administración de Usuarios

            </div>



            <div class="topbar-user">


                <div
                    class="user-avatar"
                    id="userAvatar"
                >
                    A
                </div>


                <div class="user-info">

                    <strong id="userName">
                        Administrador
                    </strong>

                    <span>
                        Support Portal
                    </span>

                </div>


            </div>


        </header>



        <!-- ==================================================
             CONTENIDO ADMINISTRATIVO
        ================================================== -->

        <section class="admin-content">


            <!-- HEADER -->

            <div class="admin-header">

                <div class="admin-header-left">

                    <h1>
                        Gestión Administrativa
                    </h1>

                    <p>
                        Administración de usuarios y accesos del sistema
                    </p>

                </div>

            </div>



            <!-- ==================================================
                 KPIs
            ================================================== -->

            <div class="admin-grid">


                <div class="admin-card admin-red">

                    <div class="admin-icon">
                        👤
                    </div>

                    <div>

                        <span>
                            Usuarios Totales
                        </span>

                        <h2 id="totalUsuarios">
                            0
                        </h2>

                    </div>

                </div>



                <div class="admin-card admin-green">

                    <div class="admin-icon">
                        ✓
                    </div>

                    <div>

                        <span>
                            Usuarios Activos
                        </span>

                        <h2 id="usuariosActivos">
                            0
                        </h2>

                    </div>

                </div>



                <div class="admin-card admin-gray">

                    <div class="admin-icon">
                        ⏸
                    </div>

                    <div>

                        <span>
                            Suspendidos
                        </span>

                        <h2 id="usuariosSuspendidos">
                            0
                        </h2>

                    </div>

                </div>


            </div>



            <!-- ==================================================
                 ACCIONES
            ================================================== -->

            <div class="admin-actions">

                <a
                    class="btn-primary"
                    href="nuevo_usuario.html"
                >
                    + Nuevo Usuario
                </a>

            </div>



            <!-- ==================================================
                 TABLA
            ================================================== -->

            <div class="admin-table-card">


                <table class="admin-table">


                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Nombre</th>

                            <th>Usuario</th>

                            <th>Correo</th>

                            <th>Rol</th>

                            <th>Estado</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>


                    <tbody id="usuariosTableBody">

                    </tbody>


                </table>


            </div>


        </section>


    </main>


</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="../js/auth.js"></script>
<script src="../js/data.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/admin.js"></script>


</body>

</html>

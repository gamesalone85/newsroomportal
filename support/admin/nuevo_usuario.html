<!DOCTYPE html>

<html lang="es">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Nuevo Usuario | Newsroom Portal
</title>


<!-- ==================================================
     CSS
================================================== -->

<link
    rel="stylesheet"
    href="../css/styles.css"
>

<link
    rel="stylesheet"
    href="../css/core-layout.css"
>


<!-- ==================================================
     FONT AWESOME
================================================== -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
```

</head>

<body>

<div class="layout">

```
<!-- ==================================================
     SIDEBAR
================================================== -->

<div
    id="sidebarContainer"
    data-sidebar="../includes/sidebar.html"
></div>



<!-- ==================================================
     CONTENIDO
================================================== -->

<main class="main-content">


    <!-- ==================================================
         TOPBAR
    ================================================== -->

    <header class="topbar">


        <div class="page-title">

            Crear Usuario

        </div>


        <div class="topbar-user">


            <div
                class="user-avatar"
                id="userAvatar"
            >
                A
            </div>


            <div class="user-info">

                <strong id="userName">
                    Administrador
                </strong>

                <span>
                    Support Portal
                </span>

            </div>


        </div>


    </header>



    <!-- ==================================================
         CONTENIDO
    ================================================== -->

    <section class="content">


        <div class="form-container">


            <!-- ==================================================
                 HEADER
            ================================================== -->

            <div class="form-header">

                <h1>
                    Crear Usuario
                </h1>

                <p>
                    Registra un nuevo usuario para Newsroom Portal.
                </p>

            </div>



            <!-- ==================================================
                 MENSAJE
            ================================================== -->

            <div
                id="formMessage"
                class="form-message"
                style="display:none;"
            ></div>



            <!-- ==================================================
                 FORMULARIO
            ================================================== -->

            <form
                id="nuevoUsuarioForm"
                autocomplete="off"
            >


                <!-- NOMBRE -->

                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Nombre completo"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- USUARIO -->

                <div class="form-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Nombre de usuario"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- CORREO -->

                <div class="form-group">

                    <label for="correo">
                        Correo
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="correo@empresa.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">
                        Contraseña temporal
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Contraseña temporal"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <!-- ROL -->

                <div class="form-group">

                    <label for="rol_id">
                        Rol
                    </label>

                    <select
                        id="rol_id"
                        name="rol_id"
                        required
                    >

                        <option value="">
                            Cargando roles...
                        </option>

                    </select>

                </div>



                <!-- ACCIONES -->

                <div class="form-actions">


                    <a
                        href="index.html"
                        class="btn-secondary"
                    >
                        Cancelar
                    </a>


                    <button
                        type="submit"
                        class="btn-primary"
                        id="guardarUsuario"
                    >

                        <i class="fa-solid fa-user-plus"></i>

                        Guardar Usuario

                    </button>


                </div>


            </form>


        </div>


    </section>


</main>
```

</div>

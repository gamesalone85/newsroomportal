<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | Newsroom Portal
    </title>


    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

    <link
        rel="stylesheet"
        href="../css/core-layout.css"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<div class="layout">


    <!-- ==================================================
         SIDEBAR
    =================================================== -->

    <div id="sidebarContainer"></div>



    <!-- ==================================================
         MAIN
    =================================================== -->

    <main class="main-content">


        <!-- ==================================================
             TOPBAR
        =================================================== -->

        <header class="topbar">


            <div class="page-title">
                Reset Password
            </div>


            <div class="topbar-user">


                <div
                    class="user-avatar"
                    id="userAvatar"
                >
                    A
                </div>


                <div class="user-info">

                    <strong id="userName">
                        Administrador
                    </strong>

                    <span>
                        Support Portal
                    </span>

                </div>


            </div>


        </header>



        <!-- ==================================================
             CONTENT
        ================================================== -->

        <section class="content">


            <div class="form-container">


                <!-- ==================================================
                     USUARIO
                ================================================== -->

                <div class="form-header">

                    <h1 id="usuarioNombre">
                        Usuario
                    </h1>

                    <p>
                        Establece una nueva contraseña para este usuario.
                    </p>

                </div>



                <!-- ==================================================
                     MENSAJE
                ================================================== -->

                <div
                    id="formMessage"
                    class="form-message"
                    style="display:none;"
                ></div>



                <!-- ==================================================
                     FORMULARIO
                ================================================== -->

                <form
                    id="resetPasswordForm"
                    autocomplete="off"
                >


                    <!-- NUEVA CONTRASEÑA -->

                    <div class="form-group">

                        <label for="password">
                            Nueva Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Nueva contraseña"
                            minlength="6"
                            required
                        >

                    </div>



                    <!-- CONFIRMAR -->

                    <div class="form-group">

                        <label for="confirmar">
                            Confirmar Contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmar"
                            name="confirmar"
                            placeholder="Repite la contraseña"
                            minlength="6"
                            required
                        >

                    </div>



                    <!-- ACCIONES -->

                    <div class="form-actions">


                        <a
                            href="index.html"
                            class="btn-secondary"
                        >
                            Volver
                        </a>


                        <button
                            class="btn-primary"
                            type="submit"
                            id="guardarPassword"
                        >
                            Guardar Nueva Contraseña
                        </button>


                    </div>


                </form>


            </div>


        </section>


    </main>


</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="../js/auth.js"></script>

<script src="../js/data.js"></script>

<script src="../js/sidebar.js"></script>

<script src="../js/reset_password.js"></script>


</body>

</html>

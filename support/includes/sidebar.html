<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {


        /* =================================================
           ELEMENTOS
        ================================================== */

        const sidebar =
            document.getElementById("sidebar");


        const toggle =
            document.getElementById("sidebarToggle");


        const logoutLink =
            document.getElementById("logoutLink");



        /* =================================================
           SESIÓN
        ================================================== */

        let session = null;


        const sessionData =
            localStorage.getItem(
                "newsroomSession"
            );


        if (sessionData) {

            try {

                session =
                    JSON.parse(sessionData);

            } catch (error) {

                console.error(
                    "Sesión inválida:",
                    error
                );

            }

        }



        /* =================================================
           ROL
        ================================================== */

        const rol =
            session
                ? Number(session.rol_id)
                : null;



        /* =================================================
           OCULTAR ELEMENTOS SEGÚN ROL
        ================================================== */

        document
            .querySelectorAll(
                "[data-role]"
            )
            .forEach(group => {


                const requiredRole =
                    Number(
                        group.dataset.role
                    );


                if (rol !== requiredRole) {

                    group.style.display =
                        "none";

                }

            });



        /* =================================================
           SIDEBAR COLLAPSE
        ================================================== */

        if (toggle) {


            toggle.addEventListener(
                "click",
                () => {


                    if (!sidebar) {

                        return;

                    }


                    sidebar.classList.toggle(
                        "collapsed"
                    );

                }
            );

        }



        /* =================================================
           DROPDOWNS
        ================================================== */

        document
            .querySelectorAll(
                ".nav-group"
            )
            .forEach(group => {


                const button =
                    group.querySelector(
                        ".nav-dropdown-btn"
                    );


                if (!button) {

                    return;

                }


                button.addEventListener(
                    "click",
                    () => {


                        if (
                            sidebar &&
                            sidebar.classList.contains(
                                "collapsed"
                            )
                        ) {

                            return;

                        }


                        group.classList.toggle(
                            "open"
                        );

                    }
                );

            });



        /* =================================================
           PÁGINA ACTUAL
        ==================================================

           Sustituye la lógica PHP:

           basename($_SERVER['PHP_SELF'])

        ================================================== */

        const currentPath =
            window.location.pathname;


        const currentFile =
            currentPath
                .split("/")
                .pop()
                .replace(
                    ".html",
                    ""
                );



        document
            .querySelectorAll(
                "[data-page]"
            )
            .forEach(link => {


                const page =
                    link.dataset.page;


                if (
                    page === currentFile
                ) {

                    link.classList.add(
                        "active"
                    );

                }

            });



        /* =================================================
           ABRIR GRUPO DE LA PÁGINA ACTUAL
        ================================================== */

        document
            .querySelectorAll(
                ".nav-group"
            )
            .forEach(group => {


                const active =
                    group.querySelector(
                        ".active"
                    );


                if (active) {

                    group.classList.add(
                        "open"
                    );

                }

            });



        /* =================================================
           CERRAR SESIÓN
        ================================================== */

        if (logoutLink) {


            logoutLink.addEventListener(
                "click",
                event => {


                    event.preventDefault();


                    const confirmar =
                        confirm(
                            "¿Deseas cerrar la sesión?"
                        );


                    if (!confirmar) {

                        return;

                    }


                    /*
                     * FUTURA AUTENTICACIÓN
                     *
                     * Aquí podremos llamar a:
                     *
                     * Firebase Auth
                     * Supabase Auth
                     * API
                     *
                     */


                    localStorage.removeItem(
                        "newsroomSession"
                    );


                    window.location.href =
                        "../../login.html";

                }
            );

        }


    }
);

</script>
